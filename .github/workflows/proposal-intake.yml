name: Proposal intake — Firestore clusters become trackable work

# WHY THIS IS ITS OWN WORKFLOW AND NOT A STEP IN autonomous-discover.yml
#
# Intake and discovery are different jobs against different sources on different
# clocks, and bolting one onto the other couples two failure domains that have
# no reason to share one:
#
#   discovery  scans THE REPOSITORY with deterministic detectors. It needs a
#              browser and a dependency tree, takes minutes, and its findings
#              exist the moment the code does.
#   intake     reads A FIRESTORE DOCUMENT that release-brain rewrites. It needs
#              neither browser nor audit, takes seconds, and has nothing to say
#              until that document changes.
#
# Sharing a workflow would mean a Playwright failure could take down intake, an
# intake credential problem would appear as a discovery failure, and neither
# could be rescheduled without moving the other. It also means the run summary
# for one would report on both — and this pipeline has already shipped a summary
# that conflated two different facts into one slot.
#
# CADENCE — CAUSAL, NOT CLOCK-BASED. THIS REPLACED A CRON THAT COULD NOT WORK.
#
# The first version ran at `cron: 40 6 * * *`, reasoning that release-brain
# rewrites system/pendingRelease from auto-release.yml at 06:00 UTC, so a
# 40-minute offset would read THAT day's document.
#
# That reasoning used NOMINAL cron times. Measured against this repository's own
# history, GitHub dispatches scheduled workflows 38-94 minutes late:
#
#     auto-release      0 6 * * *   actually ran 07:09, 06:49, 07:11, 06:38
#     pipeline-liveness 17 7 * * *  actually ran 08:15, 08:51, 08:02
#     proposal-intake  40 6 * * *   actually ran 08:02  (+82 min, first run)
#
# Both jobs drift independently by more than the gap between them, so a 40-minute
# offset establishes NOTHING about ordering. The intake could run before
# release-brain had written and read yesterday's document. On the first live run
# the order happened to hold — auto-release 07:09, intake 08:02 — by luck, and
# luck is not a design.
#
# workflow_run gives real causality: this cannot start until Auto Release has
# finished, however late either one is dispatched. The `if` below additionally
# requires that it SUCCEEDED, because a failed release job may not have written
# the document at all, and reading it then would be the same "assume it worked"
# mistake one layer down.
#
# NO CRON FALLBACK, deliberately. If Auto Release never completes, pendingRelease
# is never rewritten, so there is nothing new for the intake to read — a fallback
# would burn minutes to re-read an unchanged document and re-derive the same
# skip decisions.
#
# ACTIONS BUDGET
# Auto Release runs daily, so this still runs about once a day at roughly a
# minute — the same ~31 min/month as the cron it replaces. NOTE: autonomy/
# actions-budget.mjs projects from cron expressions only, so an event-driven
# workflow does not appear in that projection. The cost did not vanish, it
# moved out of the model.

on:
  workflow_run:
    workflows: ["Auto Release (WealthFlow)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      apply:
        description: 'File and comment (unchecked = dry run, decides but writes nothing)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write                   # mint an issue, comment on one; nothing else

concurrency:
  group: wealthflow-proposal-intake
  cancel-in-progress: false       # never cut a run off mid-write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run fires on `completed` whatever the conclusion. A failed Auto
    # Release may never have written system/pendingRelease, so reading it then
    # and calling the result "today's proposals" would be exactly the unchecked
    # assumption this trigger was introduced to remove. A manual dispatch is
    # always allowed — that is a human asking on purpose.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # NOT continue-on-error, and no `|| npm install` fallback.
      # firebase-admin is what reads the document; without it the intake cannot
      # do its job at all, and a broken install must fail as a broken install
      # rather than be laundered into "no proposals today". That conflation is
      # exactly what made fuzz-gate report test results for tests that never ran.
      #
      # This step logs `npm warn allow-scripts protobufjs@7.6.5 (postinstall)`.
      # npm 11 blocks that script and it is NOISE, verified rather than assumed:
      # protobufjs's postinstall only ever writes an advisory to stderr about
      # dependency version-pinning style — it generates no code and writes no
      # files, and it returns early when it cannot read the parent package.json.
      # Measured with `npm ci --ignore-scripts`, a real Firestore call still
      # reaches Google and comes back `16 UNAUTHENTICATED`, which is only
      # possible if protobuf serialisation and gRPC transport both worked.
      - name: Install dependencies
        run: npm ci

      # AN EVENT-DRIVEN RUN APPLIES. A manual run defaults to a dry run.
      # Applying is safe here by construction: minted issues carry
      # `proposal-derived` + `needs-triage` and never `ai-fix`, so nothing enters
      # the fix pipeline until a human promotes it. The automatic run is the
      # feature; the dry run is for inspecting a change before trusting it.
      - name: Run intake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" != "true" ]; then
            echo "Manual run without 'apply' — dry run, nothing will be written."
            node autonomy/proposal-intake.mjs
          else
            node autonomy/proposal-intake.mjs --apply
          fi

      # The script writes its plan to GITHUB_STEP_SUMMARY itself, including the
      # fail-closed case. Nothing is asserted here about what it found: a
      # workflow that claimed an outcome its own script had not reported would be
      # the same defect one layer up.
