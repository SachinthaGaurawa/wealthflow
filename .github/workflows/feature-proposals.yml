name: Self-ideation — the system thinks of its own improvements

# =============================================================================
# THE SYSTEM THINKS OF ITS OWN IMPROVEMENTS   (owner, 2026-11-07: "nothing may need my hand")
#
# Every day it studies the app (the measured roadmap and gaps in docs/superior-system-research.md, real feedback, what became of its
# earlier ideas, what already shipped), thinks of at most ONE improvement, and decides on it with rules a machine can check
# (autonomy/ideas.mjs): the idea must cite its evidence, give its if/then reasoning and score itself with user-friendliness first,
# must not touch sign-in, encryption, money arithmetic, paid services or new dependencies, and independent AIs on different providers
# must raise no objection (one objection stops it). An approved idea is filed with `approved-feature`, and the fix agent is woken to
# build it as an ordinary pull request through the usual tests, reviews and policy gate. A refused idea is filed closed, so it is
# remembered and never proposed again.
#
# DAILY, with at most 2 ideas in the pipeline at once (the cap, not the calendar, keeps it from flooding). The owner said updates are
# never held back for weeks; an idea that is ready is not held for a Monday either.
#
# Switch off with the repository variable WF_IDEAS_AUTO=0: it then files the old kind of idea that waits for the owner's label.
# =============================================================================

on:
  schedule:
    - cron: '30 2 * * *'         # every day 02:30 UTC (08:00 in Colombo), before the 04:00 scan
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Think of an idea and decide on it, but file nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read   # to read what already shipped
  actions: write        # to wake the fix agent after an idea is approved

concurrency:
  group: wealthflow-proposals
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci || npm install

      - name: Think of at most one improvement and decide on it
        id: ideate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Any one provider is enough; the router fails over on its own.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WealthFlow_API_Key: ${{ secrets.WealthFlow_API_Key }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          WF_IDEAS_AUTO: ${{ vars.WF_IDEAS_AUTO }}
        run: node autonomy/ideate.mjs

      # An issue filed with the run's own token starts no workflow by itself, so the fix agent is woken here. If nothing was approved it is not.
      - name: Wake the fix agent
        if: steps.ideate.outputs.approved == 'true' && inputs.dry_run != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run autonomous-fix.yml --ref "$DEFAULT_BRANCH"

      - name: Prove the rules still hold
        run: npx vitest run test/propose_test.js test/ideas_test.js
