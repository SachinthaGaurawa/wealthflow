name: Auto-merge safe changes (free)

# =============================================================================
# THE THIRD DEADLOCK, FIXED.
#
# This workflow used to be gated on `contains(labels.*.name, 'auto-safe')` — but
# NOTHING in the entire repository ever applied that label. Not the agent, not
# CI, not a bot. The condition was permanently false, so no pull request could
# ever auto-merge, and even a perfect autonomous fix would sit forever waiting
# for a human who was never notified.
#
# The `classify` job below applies the label itself, but only after proving the
# change is genuinely safe:
#   • it touches no sensitive path (money, auth, crypto, rules, service worker,
#     dependency manifests, CI, policy, the autonomy engine);
#   • it stays inside the blast-radius cap;
#   • it ships with a test.
#
# Nothing here can bypass a gate. Branch protection still requires the test
# suite, the consensus board, and the OPA policy gate to be green, and GitHub's
# auto-merge only fires once every required check passes. `auto-safe` grants
# permission to merge WITHOUT WAITING FOR A HUMAN — it does not grant permission
# to merge while red.
#
# SECURITY: `pull_request_target` runs in the context of the base branch, so a
# fork PR cannot rewrite this logic to label itself. This workflow never checks
# out PR code; it only reads the changed-file list from the API.
# =============================================================================

on:
  pull_request_target:
    # `ready_for_review` matters: auto-merge cannot be enabled while a PR is a
    # draft, so without it a draft that is later marked ready would never get
    # auto-merge enabled at all — the classify job would have run once, back when
    # merging was still impossible.
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Decide whether this change is auto-safe
    runs-on: ubuntu-latest
    outputs:
      safe: ${{ steps.decide.outputs.safe }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      # ── THE ONLY CHECKOUT IN THIS WORKFLOW, AND IT IS OF THE BASE ────────
      #
      # This job runs on `pull_request_target`, so it holds a write token. It has
      # never checked out PR code and it still does not: the ref below is the
      # BASE commit, which is trusted code that is already on main.
      #
      # What that buys is the content classifier. It is a plain Node script with
      # no dependencies — no `npm ci`, so no PR-authored lifecycle script runs —
      # and it reads the pull request's index.html through `git show`, as DATA.
      # The classifier that judges the diff is therefore always the one on main,
      # never the one in the pull request. That distinction is the whole reason
      # this workflow is the authority: wealthflow-ci.yml runs on `pull_request`
      # and executes the workflow file from the PR's head, so a PR could rewrite
      # its own risk gate. It cannot rewrite this one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request's content as data
        env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          # A fetch of refs/pull/N/head brings the PR's FILES into the object
          # store. Nothing from it is executed, checked out, or put on $PATH.
          #
          # The checkout above used `persist-credentials: false`, so the token is
          # not written into .git/config where a later step could reach it. It is
          # supplied here for this ONE command instead — the same Authorization
          # header actions/checkout builds internally — so the credential's reach
          # is one fetch of one ref rather than the rest of the job.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
              fetch --no-tags --quiet origin "refs/pull/$PR/head:refs/wf/pr-head" || true
          # Fails closed: without this ref the classifier is never run and
          # index.html stays sensitive.
          git rev-parse refs/wf/pr-head 2>/dev/null || echo "(pr head not fetched)"

      - name: Inspect the changed files via the API
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # No label expression here at all any more — the list is fetched from
          # the API inside the script below. That closes an injection route as
          # well as the staleness one: a label is attacker-chosen text on a
          # `pull_request_target` workflow holding a write token, and
          # `LBL='${{ toJSON(...) }}'` would let a label containing a single
          # quote close the string and continue as shell. A value that never
          # passes through expression interpolation cannot do that.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')

          # Labels LIVE, for the same reason the file list is live. The event
          # payload is a snapshot from when the run was queued, so `full-gate`
          # added afterwards would never engage — a switch whose purpose is to
          # make gating stricter, silently failing open. Unreadable means empty,
          # which denies rather than allows.
          LABELS=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | @json' 2>/dev/null) || LABELS='[]'
          [ -n "$LABELS" ] || LABELS='[]'
          echo "Changed files:"; echo "$FILES"
          COUNT=$(echo "$FILES" | grep -c . || true)

          # Must mirror policy/wealthflow.rego and autonomy/agent-swarm.mjs. If the
          # three ever disagree, the OPA policy gate is the one that actually blocks —
          # this list only decides whether to skip waiting for a human.
          # api/router.js, the inbox trio and sms-ingest were added after #111: the
          # router is the single function every /api request enters through and it
          # decides how each handler is called, and the other four are the ingestion
          # path for money — the app applies what inbox-pull returns straight to the
          # ledger. Keep in sync with wealthflow-ci.yml's SENSITIVE_REGEX;
          # test/sensitive_paths_test.js fails if the two lists drift.
          SENSITIVE='^(index\.html|sw\.js|.*\.rules|firebase\.json|vercel\.json|package(-lock)?\.json|CODEOWNERS|\.github/.*|policy/.*|autonomy/.*|api/router\.js|release\.cjs|vitest\.config\..*|consensus-review\..*|autonomous-fix-agent\.js|autonomous-brain\.js)$|auth|oauth|crypto|fifo-reconcile|allocator|send-otp|verify-otp|approve-release|release-brain|statement-store|statement-view|wealthflow-update-system|inbox-push|inbox-pull|inbox-ack|inbox-store|sms-ingest|fetch-timeout'

          HITS=$(echo "$FILES" | grep -iE "$SENSITIVE" || true)

          # ── index.html, classified by content rather than by filename ────
          #
          # index.html is 27,000 lines and holds the money math, the auth flow
          # and the sync merge alongside every stylesheet in the product, so
          # gating it whole made a border-radius cost the same approval as
          # `_wfApplyCloudData`. autonomy/classify-index-diff.mjs — the copy on
          # the BASE branch, checked out above — answers the narrower question,
          # as an allowlist: cleared only when every changed line is stylesheet,
          # markup, or the body of an explicitly listed symbol that is still free
          # of storage, network, HTML injection and crypto.
          #
          # Every failure mode below keeps index.html sensitive: the label
          # override, a missing base or head, a crash, a timeout, an unparseable
          # verdict, or the classifier's own path being in the diff (which it
          # refuses on, and which autonomy/** gates anyway). `safe` is the only
          # string that removes it, and the removal is exact-line so it cannot
          # take another path with it.
          if echo "$FILES" | grep -qx 'index\.html'; then
            IDXV=sensitive; IDXR='not classified'
            if echo "${LABELS:-}" | grep -q '"full-gate"'; then
              IDXR="the 'full-gate' label is on this PR"
            elif ! git rev-parse --verify --quiet refs/wf/pr-head >/dev/null; then
              IDXR='the PR head could not be fetched'
            else
              printf '%s\n' "$FILES" > changed.txt
              MB=$(git merge-base "$BASE_SHA" refs/wf/pr-head 2>/dev/null || true)
              if [ -z "$MB" ]; then
                IDXR='no merge base could be resolved'
              elif timeout 120 node autonomy/classify-index-diff.mjs \
                     --base "$MB" --head refs/wf/pr-head \
                     --changed-files changed.txt > verdict.json 2>&1; then
                IDXV=$(node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync("verdict.json","utf8")).verdict||"sensitive"))}catch(e){process.stdout.write("sensitive")}')
                IDXR=$(node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync("verdict.json","utf8")).reason||""))}catch(e){}')
              else
                IDXR='the classifier did not complete'
                cat verdict.json 2>/dev/null || true
              fi
            fi
            echo "index.html verdict: $IDXV — $IDXR"
            if [ "$IDXV" = "safe" ]; then
              HITS=$(echo "$HITS" | grep -vx 'index\.html' || true)
            fi
            { echo "### index.html"; echo ""; echo "\`$IDXV\` — $IDXR"; } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$HITS" ]; then
            echo "safe=no" >> "$GITHUB_OUTPUT"
            echo "reason=touches a sensitive path: $(echo "$HITS" | tr '\n' ' ' | cut -c1-200)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Blast radius — a runaway agent or an injection payload is not "safe".
          LOGIC=$(echo "$FILES" | grep -iE '\.(js|mjs|cjs)$' | grep -viE '(^|/)test/|[._]test\.|\.spec\.' | grep -c . || true)
          if [ "${LOGIC:-0}" -gt 8 ]; then
            echo "safe=no" >> "$GITHUB_OUTPUT"
            echo "reason=changes $LOGIC logic files — too large to merge unattended" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A behavioural change must arrive with a test (same rule as rego RULE 3).
          if [ "${LOGIC:-0}" -gt 0 ]; then
            if ! echo "$FILES" | grep -qiE '(^|/)tests?/|[._]test\.[a-z]+$|\.spec\.[a-z]+$'; then
              echo "safe=no" >> "$GITHUB_OUTPUT"
              echo "reason=changes logic with no accompanying test" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "safe=yes" >> "$GITHUB_OUTPUT"
          echo "reason=$COUNT file(s), no sensitive path, test included" >> "$GITHUB_OUTPUT"

      - name: Apply or revoke the auto-safe label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SAFE: ${{ steps.decide.outputs.safe }}
          REASON: ${{ steps.decide.outputs.reason }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          # `--repo` is REQUIRED here. This job never checks out the repo (it reads
          # the file list via the API), so gh has no local .git to infer the repo
          # from and fails with "fatal: not a git repository". The first real
          # autonomous PR classified correctly (SAFE: yes) but then could not apply
          # the label for exactly this reason.
          gh label create auto-safe --repo "$REPO" --color 0E8A16 \
            --description "Validated non-sensitive change — eligible for auto-merge" 2>/dev/null || true
          if [ "$SAFE" = "yes" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label auto-safe
            echo "### ✅ Marked auto-safe" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr edit "$PR" --repo "$REPO" --remove-label auto-safe 2>/dev/null || true
            echo "### 🖐️ Needs a human" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

  auto-merge:
    name: Enable auto-merge
    needs: classify
    # A DRAFT pull request cannot have auto-merge enabled. GitHub answers the
    # mutation with `GraphQL: Pull Request is still a draft (mergePullRequest)`
    # and the step exits 1 — so before this guard, every auto-safe draft turned
    # this job red. That is worse than it sounds: a check that fails every time
    # teaches you to scroll past red X's, and the next red one that actually
    # matters gets scrolled past too.
    #
    # A draft says "not ready to merge", so waiting is the correct behaviour, not
    # a limitation to work around. `ready_for_review` is on the trigger list so
    # taking the PR out of draft runs this immediately — nothing needs re-running
    # by hand.
    if: needs.classify.outputs.safe == 'yes' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (GitHub merges once every required check is green)
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
        # Branch protection remains the real gate: required status checks (tests,
        # consensus board, policy gate, fuzz gate) plus CODEOWNERS review on
        # sensitive paths. If any of those fail, the merge simply never happens.
