name: Saved people, payment details and text-message switch in a real browser
on:
  pull_request:
    paths:
      - index.html
      - wealthflow-people.js
      - wealthflow-people-ui.js
      - wealthflow-payaccounts.js
      - wealthflow-phone.js
      - wealthflow-nic.js
      - wealthflow-sms.js
      - wealthflow-liquidity.js
      - sms-events.mjs
      - sms-templates.mjs
      - sms-engine.mjs
      - test/e2e/people-book.mjs
      - test/e2e/part-payment.mjs
      - test/e2e/sms-notices.mjs
      - test/e2e/owner-otp.mjs
      - test/e2e/contacts-device.mjs
      - test/e2e/contacts-native.mjs
      - native/**
      - sms-owner-otp.mjs
      - sms-owner.mjs
      - sms-notify.js
      - sms-flush.mjs
      - test/e2e/sms-flush.mjs
      - test/e2e/harness.mjs
      - test/e2e/firebase-stub.mjs
      - .github/workflows/people-book.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The text-message switch and its phone / NIC fields on the real investment and debtor forms.
      - run: node test/e2e/sms-notices.mjs
      # The saved-people book end to end: add once and pick later, edit with the one question, delete without touching a ledger,
      # contacts import, the payment-details editor, and every screen at 320 px.
      - run: node test/e2e/people-book.mjs
      # A debtor who pays in parts: the repayment form shows the balance that will be left, Send balance asks first and pauses between taps,
      # and what the page saved is handed to the server's own wording so the text a debtor would receive is checked word for word.
      - run: node test/e2e/part-payment.mjs
      # "Alerts to my own number": a number is offered Send code instead of Save, the code row appears, a wrong code saves nothing, the right code saves the number
      # with the switch on, and switching off needs no code.
      - run: node test/e2e/owner-otp.mjs
      # The Contacts buttons beside Mobile number and Second mobile number: the device picker's number goes into its own field, cancel and refusal change nothing,
      # and a browser with no picker never opens a file dialog by itself.
      - run: node test/e2e/contacts-device.mjs
      # The same buttons inside the WealthFlow app shell (a stand-in for the native bridge): the system chooser's number goes into its own field, a cancel, refusal,
      # failure or malformed answer changes nothing, rapid taps open one chooser, and an answer that arrives after the form closed is dropped.
      - run: node test/e2e/contacts-native.mjs
      # An older entry can be read (the timeline no longer stops at the newest six), a second number reaches a loan that was never linked, and a change made
      # and the page closed at once is handed to the server in one keepalive request.
      - run: node test/e2e/sms-flush.mjs
