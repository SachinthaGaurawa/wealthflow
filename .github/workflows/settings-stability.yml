name: Settings switches really act, stay put and survive a refresh
on:
  pull_request:
    paths:
      - index.html
      - wf-ui.css
      - wf-tokens.css
      - wealthflow-notifications.js
      - wealthflow-update-system.js
      - wealthflow-intel-panel.js
      - wealthflow-release-approve.js
      - test/e2e/settings-effects.mjs
      - test/e2e/settings-lock.mjs
      - test/e2e/settings-sync.mjs
      - test/e2e/settings-stability.mjs
      - test/e2e/settings-runtime.mjs
      - test/e2e/update-journey.mjs
      - test/e2e/update-follow.mjs
      - test/e2e/new-seen-sync.mjs
      - wealthflow-new-badge.js
      - wealthflow-update-policy.js
      - test/e2e/diagnosis.mjs
      - wealthflow-diagnosis.js
      - wealthflow-migrations.js
      - test/e2e/migrations.mjs
      - test/e2e/heal.mjs
      - version.json
      - test/e2e/sync-banner.mjs
      - test/e2e/live-sync.mjs
      - test/e2e/convergence.mjs
      - test/e2e/transport-mode.mjs
      - test/e2e/connection-repair.mjs
      - wealthflow-sync-health.js
      - test/e2e/devices.mjs
      - test/e2e/firebase-cloud.mjs
      - test/e2e/firebase-stub.mjs
      - test/helpers/fake-firestore-rest.js
      - test/e2e/harness.mjs
      - .github/workflows/settings-stability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every switch and select flips, stores, mirrors to its twin and flips back, and the page does not scroll.
      - run: node test/e2e/settings-runtime.mjs
      # Each control's real EFFECT: a number format, a haptic pattern, a withheld alert, the weekly-backup day, the bell, the AI preferences.
      - run: node test/e2e/settings-effects.mjs
      # Passcode-free entry opens straight to the app after a refresh; the auto-lock menu drives the idle timer.
      - run: node test/e2e/settings-lock.mjs
      # Two devices, one cloud document: a switch changed on one is not undone by the other after a refresh or a reconnect.
      - run: node test/e2e/settings-sync.mjs
      # Nothing on the page moves when a switch is flipped, the page is rebuilt or the theme is swapped (phone, tablet and laptop widths).
      - run: node test/e2e/settings-stability.mjs
      # A change that never reaches the account is seen and retried: the notice, the retry on its own, Check Connection.
      - run: node test/e2e/sync-banner.mjs
      # The live listener cannot die quietly: ON/OFF/ON between two devices, a listener ended by an error, a silent stall, coming back to the foreground.
      - run: node test/e2e/live-sync.mjs
      # Three devices, one cloud document: rapid conflicting flips, simultaneous records, duplicate snapshots, a missed event, an upload that never answers,
      # another account's books left on the device, and the commit-to-visible latency.
      - run: node test/e2e/convergence.mjs
      # The connection mode: Safari and every iPhone / iPad browser talk to the account in steady mode (plain request-and-answer, which iCloud Private Relay lets through),
      # others keep the fast default, a saved choice wins, and Check Connection shows and switches it.
      - run: node test/e2e/transport-mode.mjs
      # Repair connection: a save that never answers is not called a refusal and does not send the person to sign out, the repair turns the offline cache off
      # and it stays off after the reload, and the connection choices survive sign-out.
      - run: node test/e2e/connection-repair.mjs
      # The whole in-app update journey: the Dashboard and Settings notices, the agreement, the PIN, the backup, the real progress bar and
      # countdown, and the centred "what changed" popup after the restart. A brand-new install is not shown that popup.
      - run: node test/e2e/update-journey.mjs
      # Copy diagnostics in a real browser: the ten-link update-system chain, the first break named, a crash on an old build shown as history,
      # nothing the owner wrote copied, and the copy never waiting for the network.
      - run: node test/e2e/diagnosis.mjs
      # Data-shape migrations on the real app and the real DB: a good one is kept, one that drops a record or a cent never touches the books,
      # a write that fails half way is put back, and an applied one can be undone.
      - run: node test/e2e/migrations.mjs
      # One account, several devices: three browsers share one cloud document; an update installed on one is seen by the second (pill and
      # Settings name the first), started by itself after a quiet minute, and ignored by the third where following is switched off.
      - run: node test/e2e/update-follow.mjs
      # The NEW label counts its 7 days from the first time the PERSON sees a thing (not from the day it shipped), and two devices of one account agree on that day.
      - run: node test/e2e/new-seen-sync.mjs
