name: Fuzz gate — sensitive paths (Phase 4 wiring)

# Completes the sensitive-path guardrail. When a PR changes a critical file
# (firestore.rules, auth/OAuth, *crypto*, money/FIFO/allocator), this job runs the
# intensive property/fuzz suite. ONLY if it passes does it apply the `fuzz-passed`
# label — which is exactly what policy/wealthflow.rego requires before such a change
# may merge. On failure it removes the label and fails the check, so a risky change
# to a critical path is mathematically barred from merging.
#
# Make this a REQUIRED status check together with policy-gate. The policy-gate
# workflow re-runs on the `labeled` event, so adding the label here unblocks it.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write     # to add/remove the fuzz-passed label

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Merge-base-correct; see .github/actions/changed-files. The old inline
      # version silently diffed against HEAD~1 when the depth-1 fetch left no
      # merge base, which could hide a sensitive-path change from this gate
      # entirely — the fuzz suite would then never run on it.
      - name: Resolve changed files
        id: changed
        uses: ./.github/actions/changed-files

      - name: Detect sensitive-path changes
        id: detect
        env:
          FILES: ${{ steps.changed.outputs.files }}
        shell: bash
        run: |
          set -uo pipefail
          echo "$FILES"
          # ONE definition, shared with policy-gate and checked against the
          # rego by test/policy_gate_test.js. The inline pattern this replaces
          # had already drifted from the policy: it omitted
          # firestore.indexes.json, which the rego counts as critical — so a PR
          # touching that file was denied for want of `fuzz-passed` while this
          # job never ran to apply it.
          grep -v '^#' policy/critical-paths.regex | grep -v '^[[:space:]]*$' > /tmp/wf-critical.regex
          if echo "$FILES" | grep -Ei -f /tmp/wf-critical.regex >/dev/null; then
            echo "sensitive=yes" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=no" >> "$GITHUB_OUTPUT"
          fi

      # ── INSTALL IS ITS OWN STEP, AND IT IS NOT ALLOWED TO FAIL QUIETLY ──────
      # This was `npm ci && npm test` inside the step below, under
      # continue-on-error. package-lock.json was gitignored, so `npm ci` exited
      # EUSAGE, `&&` short-circuited, and npm test NEVER RAN — on every
      # sensitive-path PR this gate has ever seen. The job then printed
      # "Fuzz FAILED → removing fuzz-passed and blocking" and failed the check.
      #
      # It announced a test result for tests that had not executed. That verdict
      # carried no information about the code at all: it was a broken install
      # wearing the costume of a failed fuzz run. And because RULE 1 of
      # policy/wealthflow.rego requires `fuzz-passed` before firestore.rules,
      # auth, OAuth, crypto or the money paths may merge, the repo's most
      # safety-critical files were guarded by a check that could only say no.
      #
      # Failing closed was the right direction. Lying about why was not.
      # So: install separately, with NO continue-on-error, so a broken
      # toolchain fails the job as a broken toolchain and can never again be
      # laundered into a statement about the code.
      - name: Install dependencies (must succeed — not a fuzz result)
        if: steps.detect.outputs.sensitive == 'yes'
        run: npm ci

      - name: Run intensive fuzz/property suite
        if: steps.detect.outputs.sensitive == 'yes'
        id: fuzz
        continue-on-error: true
        env:
          FUZZ_RUNS: '100000'    # the blueprint's heavy randomized-iteration gate
        run: npm test

      - name: Apply or revoke the fuzz-passed label
        if: steps.detect.outputs.sensitive == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create fuzz-passed --color 0E8A16 --description "Passed intensive fuzz gate" 2>/dev/null || true
          # Only 'success' or 'failure' can reach here: the step above ran, so
          # this is a genuine statement about the suite. An install failure has
          # already ended the job with its own name on it.
          if [ "${{ steps.fuzz.outcome }}" = "success" ]; then
            echo "Fuzz passed → labelling fuzz-passed"
            gh pr edit "$PR" --add-label fuzz-passed
          else
            echo "Fuzz FAILED → removing fuzz-passed and blocking"
            gh pr edit "$PR" --remove-label fuzz-passed 2>/dev/null || true
            exit 1
          fi

      - name: Non-sensitive change — fuzz gate not required
        if: steps.detect.outputs.sensitive == 'no'
        run: echo "No sensitive paths changed; fuzz gate not required for this PR."
