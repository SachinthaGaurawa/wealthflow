name: Consensus review board (Phase 3)

# Runs the multi-model consensus on every PR. Make this a REQUIRED status check in
# branch protection — then a PR can only merge if the independent reviewers
# unanimously PASS. This is the algorithmic replacement for human review.
#
# SECRETS (each optional, all configured ones must pass; fails closed if none):
#   WealthFlow_API_Key (Gemini), DEEPSEEK_API_KEY or XAI_API_KEY
#   NOTE: ANTHROPIC_API_KEY is deliberately NOT exposed here.

on:
  pull_request:
    # `labeled`/`unlabeled` are REQUIRED, not decorative. The board's own report
    # tells the reader to apply `human-approved` when a FAIL cites no executable
    # line — but without these triggers the label never re-runs the board, so
    # that advice was unreachable and an evidence-free FAIL from one flaky model
    # blocked the pull request forever. Adding a label must be able to change the
    # outcome, or the label is theatre.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Run on code changes always, but on a LABEL change only when the label is
    # one the board's verdict actually depends on.
    #
    # WHY: adding `labeled`/`unlabeled` above made the human-approved escape
    # hatch reachable, but it also meant EVERY label change re-ran the full
    # three-model board. auto-merge.yml adds and removes `auto-safe` on its own
    # runs, so a single pull request re-reviewed an unchanged diff five times —
    # fifteen model calls to reach the identical verdict, on free-tier quota that
    # the rest of the pipeline also depends on.
    #
    # `human-approved` still re-runs the board, because that label is exactly
    # what can flip a BLOCK into a pass. Every other label is irrelevant to the
    # verdict, so re-reviewing for it buys nothing.
    if: >-
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
      || github.event.label.name == 'human-approved'
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Multi-model consensus
        env:
          BASE_REF: ${{ github.base_ref }}
          # So the board can post its verdict onto the PR. Until now the only
          # record of a blocking decision was buried in the job log behind ~80
          # lines of runner output — effectively invisible.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Every provider is passed so the router can fail over. Reviewers pin
          # themselves to DIFFERENT providers, which is what makes the board
          # independent rather than one model voting three times.
          #
          # ANTHROPIC_API_KEY is deliberately absent: Claude authors the fixes in
          # claude-autonomous.yml, so it must never sit on the panel reviewing its
          # own work.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WealthFlow_API_Key: ${{ secrets.WealthFlow_API_Key }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: node consensus-review.mjs
