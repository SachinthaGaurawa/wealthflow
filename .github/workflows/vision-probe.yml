name: Vision probe (free)

# Does the screenshot reader really read a picture? An earlier claim (#535) said the run's own token could, through GitHub Models;
# the first run of this probe showed that was false: GitHub retired GitHub Models on 2026-07-30 and its endpoint answers 200 "OK".
# This renders invented words in a real browser and asks the reader for them (autonomy/vision-probe.mjs), with the same provider
# keys the fix agent receives, so the summary names the provider and model that really read the picture. Red = none did.
# Read-only: it changes nothing in the repository.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # weekly, so a retired model is noticed before an owner's screenshot goes unread

permissions:
  contents: read

concurrency:
  group: wf-vision-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Render a picture of invented words and read it
        env:
          # The same provider keys the fix agent receives (autonomous-fix.yml). Only the vision-capable ones matter here.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WealthFlow_API_Key: ${{ secrets.WealthFlow_API_Key }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node autonomy/vision-probe.mjs
