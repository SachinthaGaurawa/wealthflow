name: Policy gate — Conftest/OPA (Phase 4)

# Deterministic guardrail that runs on every PR as a REQUIRED status check.
# It builds a JSON description of the PR (changed files + labels) and evaluates it
# against policy/wealthflow.rego with Conftest. Any `deny` blocks the merge.
# This sits under the multi-model consensus as a mathematically-checkable firewall.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read            # the label read below goes through the issues API

jobs:
  conftest:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Merge-base-correct. The previous inline version was
      #   git fetch origin "$BASE" --depth=1 || true
      #   git diff --name-only "origin/$BASE...HEAD" 2>/dev/null || git diff --name-only HEAD~1...HEAD
      # which SILENTLY fell back to diffing against HEAD~1 whenever the depth-1
      # fetch left no merge base. On a multi-commit PR that yields the wrong file
      # list, so this gate could pass a change to a sensitive path merely because
      # that change was not in the final commit. It now fails instead of guessing.
      - name: Resolve changed files
        id: changed
        uses: ./.github/actions/changed-files

      # ── Content classification for index.html ────────────────────────────
      #
      # RULE 2's `unattended_ok` reads `input.index_html_verdict`. It is written
      # HERE and nowhere else, and it is written by running the classifier — the
      # rego never sees the diff itself.
      #
      # Everything about this step fails closed. The verdict starts as
      # `sensitive`. It becomes `safe` only if the classifier exits cleanly AND
      # prints exactly that word. A crash, a timeout, a malformed line, index.html
      # not being in the diff at all, or the `full-gate` label being present all
      # leave it `sensitive`, and RULE 2 then applies in full. There is no path
      # from "something went wrong" to "allowed".
      # ── READ THE LABELS LIVE, NOT FROM THE EVENT PAYLOAD ─────────────────
      #
      # THIS GATE BLOCKED A CORRECTLY-LABELLED PULL REQUEST. On #133, with
      # `human-approved` sitting on the PR, conftest was handed
      #
      #     LABELS: []
      #     "labels": [],
      #
      # and denied all nine guardrail paths for want of the very label that was
      # there. `github.event.pull_request.labels` is a SNAPSHOT from when the run
      # was queued, so any run queued before the label went on carries an empty
      # list forever — and "Re-run failed jobs" cannot help, because a re-run
      # replays the original payload.
      #
      # wealthflow-ci.yml already documents this exact failure and already fixed
      # it for the Risk gate, in a comment that says the payload "reports the
      # labels as they were then — not as they are now". The fix was never
      # carried across to this file. That is this repository's most common defect
      # by a distance: a hardening applied to one caller and not to its sibling.
      #
      # FAILS CLOSED. If the API cannot be read the list stays EMPTY, which
      # denies rather than allows — the opposite direction from the payload bug,
      # and the safe one.
      - name: Read the PR's labels from the API
        id: labels
        if: github.event.pull_request.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          if LIVE=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | @json' 2>/dev/null) \
             && [ -n "$LIVE" ]; then
            echo "labels currently on the PR: $LIVE"
          else
            echo "::warning::Could not read the PR's labels — evaluating the policy as if it carries none."
            LIVE='[]'
          fi
          echo "json=$LIVE" >> "$GITHUB_OUTPUT"

      - name: Classify the index.html diff
        id: idx
        env:
          FILES_RAW: ${{ steps.changed.outputs.files }}
          BASE_SHA: ${{ steps.changed.outputs.base_sha }}
          HEAD_SHA: ${{ steps.changed.outputs.head_sha }}
          LABELS: ${{ steps.labels.outputs.json }}
        shell: bash
        run: |
          set -uo pipefail
          echo "verdict=sensitive" >> "$GITHUB_OUTPUT"

          # A manual override the owner can reach for at any time: put `full-gate`
          # on the PR and the content classifier is not consulted at all.
          if echo "$LABELS" | grep -q '"full-gate"'; then
            echo "'full-gate' is on this PR — the content classifier is disabled for it."
            exit 0
          fi

          printf '%s\n' "$FILES_RAW" > changed.txt
          if ! grep -qx 'index\.html' changed.txt; then
            echo "index.html is not in this diff — nothing to classify."
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "::warning::No base/head sha to diff against — index.html stays fully gated."
            exit 0
          fi

          # 120s is generous for a 1.5 MB file; a classifier that hangs is a
          # classifier that has lost track, and a hang must not become a pass.
          if ! timeout 120 node autonomy/classify-index-diff.mjs \
                 --base "$BASE_SHA" --head "$HEAD_SHA" \
                 --changed-files changed.txt > verdict.json 2>classify.err; then
            echo "::warning::The classifier did not complete — index.html stays fully gated."
            cat classify.err || true
            exit 0
          fi

          V=$(node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync("verdict.json","utf8")).verdict||""))}catch(e){}')
          R=$(node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync("verdict.json","utf8")).reason||""))}catch(e){}')
          if [ "$V" = "safe" ]; then
            echo "verdict=safe" >> "$GITHUB_OUTPUT"
            echo "✓ index.html: $R"
          else
            echo "index.html stays gated: ${R:-no verdict could be read}"
          fi
          {
            echo "### index.html content classification"
            echo ""
            echo "**Verdict:** \`${V:-unreadable}\` — ${R:-no reason given}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── THE FUZZ VERDICT COMES FROM THE CHECK, NOT FROM A LABEL ─────────
      #
      # RULE 1 requires `fuzz-passed` before a critical path may merge, and
      # fuzz-gate.yml applies that label with `gh pr edit` using GITHUB_TOKEN.
      # GitHub does not create workflow runs from actions taken with
      # GITHUB_TOKEN — that is its loop-prevention rule — so the `labeled` event
      # fires and THIS WORKFLOW NEVER WAKES. fuzz-gate.yml's own header claims
      # "the policy-gate workflow re-runs on the `labeled` event, so adding the
      # label here unblocks it". It does not.
      #
      # Observed on #152: fuzz-gate applied `fuzz-passed` at 08:48:18 and no
      # policy-gate run followed. That PR was unblocked only because a HUMAN
      # later added `human-approved`, which does re-trigger. A PR whose only
      # blocker is `fuzz-passed` — a critical-path change with no other
      # sensitive file — stays red forever with nothing wrong with it.
      #
      # So the label stops being the channel. This asks the check run itself
      # whether the fuzz suite passed ON THIS COMMIT, which is strictly better
      # than a label in two ways: it cannot fail to be delivered, and it cannot
      # be STALE. A label survives a push; a check run is bound to a SHA, so a
      # `fuzz-passed` left over from an earlier commit can no longer speak for
      # code that has changed since.
      #
      # FAILS CLOSED at every step: no critical path means the question is not
      # asked at all; an unreadable API, a timeout, a failure or anything other
      # than a concluded success leaves the verdict `no` and RULE 1 in force.
      - name: Resolve the fuzz gate's verdict for this commit
        id: fuzz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          FILES_RAW: ${{ steps.changed.outputs.files }}
        shell: bash
        run: |
          set -uo pipefail
          echo "passed=no" >> "$GITHUB_OUTPUT"

          if [ -z "${SHA:-}" ]; then
            echo "No pull-request head sha — the fuzz gate does not apply here."
            exit 0
          fi

          # The SAME critical-path definition fuzz-gate.yml and the rego use.
          grep -v '^#' policy/critical-paths.regex | grep -v '^[[:space:]]*$' > /tmp/wf-critical.regex
          if ! printf '%s\n' "$FILES_RAW" | grep -Eiq -f /tmp/wf-critical.regex; then
            echo "No critical path in this diff — RULE 1 does not apply."
            exit 0
          fi
          echo "A critical path changed. Waiting for the fuzz gate's verdict on $SHA."

          # Both workflows start together and the fuzz suite takes longer than
          # this one, so the answer is normally not ready on the first look.
          # Bounded: 24 x 15s = 6 minutes, then fail closed.
          for i in $(seq 1 24); do
            OUT=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                    --jq '[.check_runs[] | select(.name == "fuzz")]
                          | sort_by(.started_at) | last
                          | "\(.status // "none") \(.conclusion // "none")"' 2>/dev/null || echo "error none")
            STATUS=${OUT%% *}
            CONC=${OUT##* }
            echo "  attempt $i: fuzz status=$STATUS conclusion=$CONC"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONC" = "success" ]; then
                echo "passed=yes" >> "$GITHUB_OUTPUT"
                echo "The fuzz gate passed on this commit."
              else
                echo "The fuzz gate did not pass on this commit ($CONC) — RULE 1 stays in force."
              fi
              exit 0
            fi
            if [ "$STATUS" = "none" ] && [ "$i" -ge 4 ]; then
              echo "::warning::No fuzz check run exists for this commit — RULE 1 stays in force."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::The fuzz gate did not conclude within 6 minutes — RULE 1 stays in force."

      - name: Build PR input for policy evaluation
        env:
          # From the API read above, never from the event payload — see the note
          # on that step. This is the value the rego actually decides on.
          LABELS: ${{ steps.labels.outputs.json }}
          INDEX_VERDICT: ${{ steps.idx.outputs.verdict }}
          # Not read from the PR's labels: resolved from the fuzz check run for
          # this commit, because the label cannot re-trigger this workflow and
          # can outlive the code it was granted for. See the step above.
          FUZZ_VERIFIED: ${{ steps.fuzz.outputs.passed }}
        shell: bash
        run: |
          set -euo pipefail
          export FILES_RAW="${{ steps.changed.outputs.files }}"
          node -e '
            const files=(process.env.FILES_RAW||"").split("\n").filter(Boolean);
            const labels=JSON.parse(process.env.LABELS||"[]");
            /* RULE 1 reads `fuzz-passed` out of input.labels. It now gets there
             * from the CHECK RUN rather than from the PR, so the rule is
             * unchanged while the fact behind it became verifiable and
             * commit-bound. A human cannot hand-apply their way past RULE 1 by
             * pasting the label on, either — this list is rebuilt from the
             * check, and a stale one is dropped. */
            const i = labels.indexOf("fuzz-passed");
            if (i >= 0) labels.splice(i, 1);
            if (process.env.FUZZ_VERIFIED === "yes") labels.push("fuzz-passed");
            // Anything other than the literal string "safe" leaves RULE 2 in force.
            const index_html_verdict = process.env.INDEX_VERDICT === "safe" ? "safe" : "sensitive";
            require("fs").writeFileSync("pr-input.json", JSON.stringify({files,labels,index_html_verdict},null,2));
            console.log(JSON.stringify({files,labels,index_html_verdict},null,2));
          '

      - name: Install Conftest
        run: |
          CT=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CT}/conftest_${CT}_Linux_x86_64.tar.gz" | tar xz conftest
          sudo mv conftest /usr/local/bin/

      - name: Evaluate policy
        run: conftest test pr-input.json --policy policy/ --all-namespaces
