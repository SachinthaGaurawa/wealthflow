name: Secret scan (no credentials in the repo)

# =============================================================================
# Four live provider credentials were committed to this repository and served to
# every visitor's browser:
#   • 2 Gemini keys + 1 Groq key in wealthflow-ai-v4.js (loaded by index.html)
#   • 1 Alpha Vantage key in market-data.js
# plus the Firebase Web key repeated as a literal across five server files.
#
# They sat in git history for months because nothing in CI ever looked for them.
# This job is that missing check. Make it a REQUIRED status check so neither a
# human nor the autonomous agent can reintroduce one.
#
# It cannot un-publish what is already in history — those keys must be ROTATED at
# the provider. This stops the next one.
# =============================================================================

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: No committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Zero dependencies — this must keep working even if npm install breaks,
      # because a secret leak is exactly the thing you cannot afford to skip.
      - name: Scan tracked files for provider credentials
        run: node autonomy/secret-scan.mjs
