name: Autonomous fix agent (free)

# =============================================================================
# THE WORKFLOW THAT HID THE FAILURE.
#
# The agent step used to carry `continue-on-error: true`. So when the agent died
# in 40ms on `JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)` — every two hours,
# for months — this job reported ✅ success and the next step quietly logged
# "no fix this run". Verified in run 30200095048: the "Run the fix agent" step
# starts and completes on the same second.
#
# It also passed only GEMINI_API_KEY, while the key configured on this project is
# named WealthFlow_API_Key. Even a working agent would have found no model.
#
# WHAT IS DIFFERENT NOW
#   • EVERY provider key is passed, and any ONE of them is enough to run.
#   • The agent's exit code is interpreted, not swallowed:
#       0 → a fix was drafted        (validate it and open a PR)
#       3 → genuinely nothing to do  (green, and the summary says why)
#       1 → MISCONFIGURED or broken  (the job FAILS and opens an alert issue)
#     A crash can never again look like a success.
#   • It runs on `issues: opened` as well as on a schedule, so feedback that
#     arrives from the app is picked up in minutes instead of hours.
#
# AUTONOMY_LEVEL (repo variable — Settings → Secrets and variables → Actions):
#   unset / "pr"  (DEFAULT, recommended) → open a PR. auto-merge.yml labels it
#         auto-safe when it qualifies, and GitHub merges it the moment the test
#         suite, consensus board and policy gate are all green. This is FULLY
#         autonomous — no human in the loop — but every gate is real.
#   "direct" → commit straight to the default branch and ship immediately.
#         Faster, but it skips the consensus board and the policy gate. Only
#         choose this if you want speed over review.
# =============================================================================

on:
  schedule:
    - cron: '0 */2 * * *'        # every 2h — see NOTE ON ACTIONS MINUTES below
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Work on this issue number only (blank = highest priority)'
        required: false
        type: string
      dry_run:
        description: 'Analyse and report, but write nothing'
        type: boolean
        default: false

# NOTE ON ACTIONS MINUTES: on a PRIVATE repo GitHub Free gives 2,000 min/month.
# At every 2h this job uses roughly 12 × 2 min/day ≈ 720 min/month, which leaves
# headroom for CI. If the repo is PUBLIC, minutes are unlimited and the cron can
# safely be tightened.

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: wealthflow-main-push
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Skip issues the pipeline files for humans, and skip its own noise.
    if: >-
      github.event_name != 'issues' ||
      (!contains(github.event.issue.labels.*.name, 'auto-rollback') &&
       !contains(github.event.issue.labels.*.name, 'ai-stuck') &&
       !contains(github.event.issue.labels.*.name, 'pipeline-health'))
    steps:
      # Egress firewall FIRST, before any untrusted issue text is read. An issue
      # body is attacker-controlled input in the general case, so even if a
      # prompt-injection payload convinced a model to try to exfiltrate a secret,
      # the attempt is recorded at the kernel level.
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci || npm install

      - name: Run the autonomous agent
        id: agent
        env:
          # ── the work queue ──
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_ISSUE: ${{ github.event.issue.number || inputs.issue }}
          AGENT_DRY_RUN: ${{ inputs.dry_run }}
          AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
          # ── every model provider; ANY ONE is enough ──
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WealthFlow_API_Key: ${{ secrets.WealthFlow_API_Key }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ── optional enrichment; its absence is no longer fatal ──
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set +e
          node autonomous-fix-agent.js
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          case "$RC" in
            0) echo "have=yes" >> "$GITHUB_OUTPUT"; echo "agent drafted a fix" ;;
            3) echo "have=no"  >> "$GITHUB_OUTPUT"; echo "nothing to do this run (a genuine no-op)" ;;
            *) echo "have=no"  >> "$GITHUB_OUTPUT"
               echo "::error::The autonomous agent is MISCONFIGURED or broken (exit $RC). See the job summary."
               exit "$RC" ;;
          esac

      - name: Confirm the agent really changed something
        id: check
        if: steps.agent.outputs.have == 'yes'
        run: |
          set -euo pipefail
          if [ ! -f ai-fix-pr.json ]; then
            echo "::error::agent exited 0 but wrote no ai-fix-pr.json — treating as a failure, not a no-op"
            exit 1
          fi
          FILE=$(node -p "require('./ai-fix-pr.json').file" 2>/dev/null || true)
          TEST=$(node -p "require('./ai-fix-pr.json').testFile || ''" 2>/dev/null || true)
          ISSUE=$(node -p "require('./ai-fix-pr.json').issue || ''" 2>/dev/null || true)
          if [ -z "${FILE:-}" ] || [ "$FILE" = "undefined" ] || [ ! -f "$FILE" ]; then
            echo "::error::ai-fix-pr.json names no valid file ('$FILE')"
            exit 1
          fi
          if git diff --quiet -- "$FILE"; then
            echo "::error::agent claimed a fix to $FILE but the file is unchanged"
            exit 1
          fi
          echo "file=$FILE"  >> "$GITHUB_OUTPUT"
          echo "test=$TEST"  >> "$GITHUB_OUTPUT"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "verified change to $FILE${TEST:+ (+ $TEST)}"

      - name: Validate (syntax + full test suite)
        id: validate
        if: steps.check.outputs.file != ''
        continue-on-error: true          # a red validation is information, not a crash
        env:
          FIX_FILE: ${{ steps.check.outputs.file }}
        run: |
          set -euo pipefail
          node --check "$FIX_FILE"
          npm test
          echo "ok=yes" >> "$GITHUB_OUTPUT"

      - name: Open the pull request (default — fully autonomous via auto-merge)
        if: steps.check.outputs.file != '' && vars.AUTONOMY_LEVEL != 'direct'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIX_FILE: ${{ steps.check.outputs.file }}
          TEST_FILE: ${{ steps.check.outputs.test }}
          ISSUE: ${{ steps.check.outputs.issue }}
          VALIDATED: ${{ steps.validate.outputs.ok }}
        run: |
          set -euo pipefail
          TITLE=$(node -p "require('./ai-fix-pr.json').title" 2>/dev/null || echo "fix: automated patch")
          node -e "process.stdout.write(String(require('./ai-fix-pr.json').body || 'Autonomous fix.'))" > pr-body.txt
          if [ "${VALIDATED:-}" != "yes" ]; then
            printf '\n\n> ⚠️ **Local validation did not pass.** CI will re-run it; this PR will not auto-merge while red.\n' >> pr-body.txt
          fi

          BRANCH="ai-fix/issue-${ISSUE:-x}-$(date +%s)"
          git config user.name  'wealthflow-agent'
          git config user.email 'agent@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -- "$FIX_FILE"
          [ -n "${TEST_FILE:-}" ] && git add -- "$TEST_FILE" || true
          [ -d autonomy/state ] && git add -- autonomy/state || true
          git commit -m "$TITLE"
          for i in 1 2 3 4; do
            git push -u origin "$BRANCH" && break
            echo "push failed (attempt $i) — backing off"; sleep $((2 ** i))
          done

          gh label create ai-fix --color FFA500 --description "Autonomous fix" 2>/dev/null || true
          gh pr create --title "$TITLE" --body-file pr-body.txt \
            --base "${GITHUB_REF_NAME}" --head "$BRANCH" --label ai-fix

      - name: Commit and ship directly (AUTONOMY_LEVEL=direct)
        if: steps.check.outputs.file != '' && steps.validate.outputs.ok == 'yes' && vars.AUTONOMY_LEVEL == 'direct'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIX_FILE: ${{ steps.check.outputs.file }}
          TEST_FILE: ${{ steps.check.outputs.test }}
          ISSUE: ${{ steps.check.outputs.issue }}
        run: |
          set -euo pipefail
          TITLE=$(node -p "require('./ai-fix-pr.json').title" 2>/dev/null || echo "fix: automated patch")
          git config user.name  'wealthflow-agent'
          git config user.email 'agent@users.noreply.github.com'
          git add -- "$FIX_FILE"
          [ -n "${TEST_FILE:-}" ] && git add -- "$TEST_FILE" || true
          [ -d autonomy/state ] && git add -- autonomy/state || true
          git commit -m "$TITLE"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          # --note takes the title as ONE argv entry, so quotes/backticks stay inert
          node release.cjs --patch --push --note "$TITLE"
          if [ -n "${ISSUE:-}" ]; then
            gh issue comment "$ISSUE" --body "$(printf '### ✅ Shipped\n\nThis fix is live in the release just cut from `%s`.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$FIX_FILE")" || true
          fi

      - name: Report the outcome honestly
        if: always()
        env:
          RC: ${{ steps.agent.outputs.rc }}
          FILE: ${{ steps.check.outputs.file }}
          VALIDATED: ${{ steps.validate.outputs.ok }}
        run: |
          {
            echo "### Autonomous agent run"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Agent exit code | \`${RC:-n/a}\` |"
            echo "| File changed | ${FILE:-_none_} |"
            echo "| Local validation | ${VALIDATED:-not run} |"
            echo "| Mode | ${{ vars.AUTONOMY_LEVEL || 'pr' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
