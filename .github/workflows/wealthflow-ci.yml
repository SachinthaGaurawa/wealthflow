name: WealthFlow CI (free)

# Runs on every pull request to main. 100% free on GitHub Actions
# (2,000 free minutes/month on private repos; unlimited on public).
# This is the SAFETY HARNESS: no change — human OR AI-authored — reaches
# production without (1) the test suite passing and (2) the risk gate passing.

on:
  pull_request:
    branches: [main]
    # `labeled` / `unlabeled` are ESSENTIAL, not cosmetic.
    #
    # With the default types (opened, synchronize, reopened) this workflow does not
    # re-run when a label changes — so adding `human-approved` could never clear the
    # risk gate below. Worse, RE-RUNNING the existing run does not help either:
    # a re-run replays the ORIGINAL event payload, in which the label list was still
    # empty, so `contains(github.event.pull_request.labels.*.name, …)` stays false
    # forever. The documented escape hatch was unreachable except by pushing a new
    # commit after the label already existed.
    #
    # That is the same failure family as everything else the autonomy work uncovered:
    # a control that looks present, reports cleanly, and cannot actually be used.
    # policy-gate.yml already listed these types; this one did not.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: read            # the risk gate reads the PR's labels live via the API

jobs:
  test:
    name: Tests + fuzz (shadow harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install
        run: npm ci || npm install
      - name: Run test suite (Vitest + fast-check property/fuzz)
        run: npm test
      # Make this a REQUIRED status check in branch protection so nothing
      # merges on red. This is the gate that contains AI mistakes.

  risk-gate:
    name: Risk gate (sensitive paths need human approval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── IS THERE ANYTHING HERE TO GATE? ──────────────────────────────────
      # This job answers one question: "does this PULL REQUEST need human
      # approval before it may merge?" On a manual workflow_dispatch there is
      # no pull request, so there is no diff — and the changed-files action
      # correctly refused to invent one:
      #
      #   Could not determine the changed-file list (base='?', pr='?').
      #   Refusing to fall back to HEAD~1 — a partial file list would let a
      #   gate pass a change it should block.
      #
      # That refusal is right and stays. The bug was asking the question at
      # all when no pull request exists: five manual runs on main failed for
      # having nothing to measure rather than for anything being wrong.
      #
      # WHY A DISPATCH ON A NON-DEFAULT BRANCH STILL FAILS
      # A check run is keyed on (name, SHA). If a manual run could report
      # "Risk gate ✓" on an arbitrary branch, then dispatching it against a
      # pull request's head would mint exactly the check that branch
      # protection is waiting for — turning "no PR to gate" into a way to
      # certify a PR without ever gating it. Anyone with write access could
      # do it, and so could an agent holding a token with actions: write,
      # which is precisely the actor this pipeline exists to constrain.
      #
      # So the not-applicable path is allowed ONLY on the default branch,
      # which can never be a pull request's head. Everywhere else a
      # non-PR run fails closed. The gate becomes unnecessary where there is
      # nothing to gate, and stays unbypassable everywhere it matters.
      - name: Is a pull request in scope?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            echo "gate=yes" >> "$GITHUB_OUTPUT"
            echo "pull request in scope — evaluating sensitive paths."
            exit 0
          fi

          DEF="${DEFAULT_BRANCH:-main}"
          if [ "$REF_NAME" != "$DEF" ]; then
            echo "::error::'$EVENT' run on '$REF_NAME' cannot certify anything. This job gates pull requests; a manual run on a non-default branch could publish a passing 'Risk gate' check for a commit that is a PR head, which is a bypass. Open a pull request instead."
            exit 1
          fi

          echo "gate=no" >> "$GITHUB_OUTPUT"
          echo "No pull request in scope ('$EVENT' on the default branch '$DEF')."
          echo "Nothing to gate: this job decides whether a PR may merge, and no merge is pending."
          {
            echo "### Risk gate: not applicable"
            echo ""
            echo "\`$EVENT\` on \`$DEF\` — there is no pull request, so there is no"
            echo "diff to classify and no merge to block. Sensitive-path enforcement is"
            echo "unchanged for pull requests."
          } >> "$GITHUB_STEP_SUMMARY"

      # Read the label LIVE from the API rather than from github.event.
      #
      # The event payload is a snapshot from when the run was queued, so on a re-run
      # it reports the labels as they were then — not as they are now. Querying the
      # API means "Re-run failed jobs" works after labelling, which is the obvious
      # thing to try and previously did nothing.
      - name: Check for human approval (live, not from the event payload)
        id: approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Fallback to the payload for workflow_dispatch, where there is no PR.
          PAYLOAD_HAS: ${{ contains(github.event.pull_request.labels.*.name, 'human-approved') }}
        shell: bash
        run: |
          set -uo pipefail

          # FAIL CLOSED. Caught by the consensus board reviewing this very file:
          # the first version kept the event-payload value as a fallback, so if
          # the API call failed, HAS silently retained the stale payload value.
          # If someone REMOVED the label and the API call then errored, that
          # would fail OPEN and allow a sensitive change through on a label that
          # no longer exists.
          #
          # For a pull request the API is the ONLY authority. An API failure now
          # means "not approved", never "keep whatever the snapshot said".
          if [ -n "${PR:-}" ]; then
            if LIVE=$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' 2>/dev/null); then
              echo "labels currently on the PR: ${LIVE:-<none>}"
              HAS=false
              case ",$LIVE," in
                *,human-approved,*) HAS=true ;;
              esac
            else
              echo "::warning::Could not read the PR's labels from the API — treating this as NOT approved."
              HAS=false
            fi
          else
            # No PR context (workflow_dispatch). There is no label to read, so the
            # payload expression is the only available signal.
            HAS="${PAYLOAD_HAS:-false}"
          fi

          echo "has_human_approval=$HAS" >> "$GITHUB_OUTPUT"
          echo "human-approved: $HAS"

          # WHEN it went on. The label list carries no time, and the freshness
          # check below needs one: a label is attached to the PULL REQUEST, not
          # to a commit, so without a timestamp there is no way to tell whether
          # it was granted before or after the code it is being read against.
          # The timeline's created_at is assigned by GitHub, not by a client.
          LAT=""
          if [ "$HAS" = "true" ] && [ -n "${PR:-}" ]; then
            LAT=$(gh api "repos/$REPO/issues/$PR/timeline" --paginate \
                    --jq '[.[] | select(.event == "labeled" and .label.name == "human-approved") | .created_at] | last // ""' \
                  2>/dev/null) || LAT=""
          fi
          echo "labeled_at=$LAT" >> "$GITHUB_OUTPUT"
          echo "approved at: ${LAT:-<unknown>}"

      # Merge-base-correct, and it fails rather than guessing. Replaces the
      # `git fetch --depth=1` + `git diff base...HEAD` pattern that aborted with
      # "fatal: origin/main...HEAD: no merge base" as soon as main advanced —
      # which happens hourly here, because merchant-sync pushes to main every hour.
      - name: Resolve changed files
        id: changed
        if: steps.scope.outputs.gate == 'yes'
        uses: ./.github/actions/changed-files

      - name: Classify changed files
        id: classify
        if: steps.scope.outputs.gate == 'yes'
        env:
          # PRs carrying this label have a human approver and may touch sensitive paths.
          HAS_HUMAN_APPROVAL: ${{ steps.approval.outputs.has_human_approval }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          CHANGED="$CHANGED_FILES"
          echo "Changed files:"; echo "$CHANGED"

          # SENSITIVE PATHS — money, auth, security, data rules, the service worker,
          # dependency manifests, AND the pipeline's own machinery. A change here may
          # NOT auto-merge; it requires a human-approved label (and, via CODEOWNERS,
          # a human review).
          #
          # WHY THE SECOND HALF OF THIS LIST EXISTS
          #   This gate is named "sensitive paths need human approval", and until now
          #   it was blind to .github/, policy/, autonomy/, release.cjs and CODEOWNERS
          #   — the files that DEFINE every gate in this repository, including this
          #   one. A PR editing wealthflow-ci.yml, even one deleting this very step,
          #   was told "✓ No sensitive paths touched — eligible for auto-merge".
          #
          #   It was caught because auto-merge.yml's classifier and policy/*.rego both
          #   cover those paths, so nothing shipped unreviewed. But those are the
          #   backstops; a boundary gate that abstains on the highest-privilege file
          #   class in the repo leaves the rego as the only thing that must not fail,
          #   and a gate that fails open is the exact defect this pipeline has already
          #   produced once (the consensus board, fixed in #57).
          #
          #   The divergence was the whole bug: two lists, in two workflows, drifting
          #   apart silently. test/sensitive_paths_test.js now extracts BOTH regexes
          #   from these YAML files and runs them through real `grep -E` against a
          #   canonical list, so they can never disagree again without a red test.
          #   Keep this list and auto-merge.yml's SENSITIVE in sync — the test will
          #   tell you if you forget.
          #   api/router.js and the ingestion path were added after #111. The router
          #   is the SINGLE function Vercel builds: every /api request enters through
          #   it, and it decides both which handler runs and HOW it is called. A
          #   mismatch there disabled twelve endpoints for months while every gate in
          #   this repo stayed green, and that PR was auto-labelled `auto-safe`
          #   because no list matched it. sms-ingest accepts a bank SMS from the
          #   public internet and the inbox trio moves the resulting transaction into
          #   and out of the database — which the app applies straight to the ledger.
          SENSITIVE_REGEX='^(index\.html|firestore\.rules|firebase\.json|.*\.rules|package\.json|package-lock\.json|sw\.js|vercel\.json|CODEOWNERS|\.github/.*|policy/.*|autonomy/.*|api/router\.js|release\.cjs|release-brain\.js|statement-store\.js|statement-view\.js|wealthflow-update-system\.js|inbox-[a-z]+\.(js|mjs)|sms-ingest\.js|fetch-timeout\.mjs|vitest\.config\..*|consensus-review\..*|autonomous-fix-agent\.js|autonomous-brain\.js|.*auth.*|.*oauth.*|.*fifo-reconcile.*|.*allocator.*|.*crypto.*|.*approve-release.*|send-otp\.js|verify-otp\.js)$'

          HITS=$(echo "$CHANGED" | grep -iE "$SENSITIVE_REGEX" || true)
          if [ -n "$HITS" ]; then
            echo "::group::Sensitive paths touched"
            echo "$HITS"
            echo "::endgroup::"
            # Published so the freshness step can ask, per file, whether it moved
            # after the approval was granted.
            {
              echo "sensitive=yes"
              echo "sensitive_files<<WF_EOF"
              echo "$HITS"
              echo "WF_EOF"
            } >> "$GITHUB_OUTPUT"
            if [ "$HAS_HUMAN_APPROVAL" = "true" ]; then
              echo "✓ Sensitive change is carrying the 'human-approved' label — checking that the label is not older than the change."
            else
              echo "::error::This PR changes money/auth/security/data-rule files. It must be reviewed and labelled 'human-approved' before merge. Auto-merge is blocked for these paths by design."
              exit 1
            fi
          else
            echo "sensitive=no" >> "$GITHUB_OUTPUT"
            echo "✓ No sensitive paths touched — eligible for auto-merge once tests are green."
          fi

      # ── AN APPROVAL CANNOT COVER CODE THAT DID NOT EXIST WHEN IT WAS GIVEN ──
      #
      # A label belongs to the PULL REQUEST, not to a commit. Once `human-approved`
      # is on it stays on through every later push, so an approval granted for one
      # diff silently covers every diff that follows it.
      #
      # Not hypothetical. On PR #127 the label was applied at 12:03; two commits
      # after it changed index.html and autonomy/perf-budget.mjs, and the step
      # above printed
      #     ✓ Sensitive change is carrying the 'human-approved' label — allowed.
      # for a head the approver had never seen. That is the same family as every
      # other defect this file's history records: a control that is present,
      # reports cleanly, and does not hold.
      #
      # The label is NOT removed automatically on push. That would demand a fresh
      # approval after every single commit, which is the opposite of batching work
      # and getting one decision on it. Instead: a batch of commits followed by one
      # labelling is approved, and a sensitive commit AFTER the labelling is not.
      #
      # The `since` filter compares against each commit's committer date, which is
      # written by the committer's own clock rather than by GitHub. That is enough
      # to stop an approval being extended by later work — which is what this
      # guards — and it is not a defence against someone who can set that clock.
      # The label's own timestamp is server-assigned.
      #
      # `since` is INCLUSIVE — checked against the live API, which returned the
      # 12:03:29 commit for since=12:03:29Z. So a commit landing in the same second
      # as the labelling counts as stale and a fresh label is asked for. That is the
      # safe direction, and labelling always follows the push it approves anyway.
      - name: Refuse an approval that predates the sensitive change
        if: steps.scope.outputs.gate == 'yes' && steps.classify.outputs.sensitive == 'yes' && steps.approval.outputs.has_human_approval == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELED_AT: ${{ steps.approval.outputs.labeled_at }}
          SENSITIVE_FILES: ${{ steps.classify.outputs.sensitive_files }}
        shell: bash
        run: |
          set -uo pipefail

          # FAIL CLOSED, exactly as the label read does. If we cannot establish
          # WHEN the approval was given, we cannot claim it covers this code.
          if [ -z "${LABELED_AT:-}" ]; then
            echo "::error::The 'human-approved' label is present but its timestamp could not be read, so there is no way to tell whether it predates these changes. Remove and re-apply the label."
            exit 1
          fi
          echo "approval granted at: $LABELED_AT"

          STALE=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if N=$(gh api -X GET "repos/$REPO/commits" \
                     -f sha="$HEAD_SHA" -f path="$f" -f since="$LABELED_AT" \
                     --jq 'length' 2>/dev/null); then
              :
            else
              echo "::error::Could not check whether $f changed after the approval — treating it as unapproved."
              exit 1
            fi
            case "$N" in
              ''|*[!0-9]*)
                echo "::error::Unreadable commit count for $f — treating it as unapproved."
                exit 1 ;;
            esac
            if [ "$N" -gt 0 ]; then STALE="$(printf '%s%s\n' "$STALE" "$f")"; fi
          done <<< "$SENSITIVE_FILES"

          if [ -n "$STALE" ]; then
            echo "::group::Changed AFTER the approval was given"
            printf '%s\n' "$STALE"
            echo "::endgroup::"
            echo "::error::These sensitive files changed after 'human-approved' was applied, so the label covers code the approver never saw. Remove the label and re-apply it to approve the current head."
            exit 1
          fi
          echo "✓ Every sensitive file predates the approval — the label covers this head."
