name: Autonomous PR recovery (free)

# =============================================================================
# When the agent's own pull request goes red, nothing used to notice.
#
# The work queue treats an issue with an open `ai-fix/issue-<n>-*` PR as claimed, so the agent never looked at it again,
# and a red PR sat there while the issue stayed claimed forever. This job closes that gap (autonomy/pr-recovery.mjs):
#   - a check that failed on its first attempt is re-run once (a dead runner is not a wrong fix);
#   - a check that failed twice hands the issue back: the PR is closed, the issue gets a comment saying what failed,
#     and the fix agent starts again and is shown that comment. The attempt that opened the PR already counted against
#     the issue's 3, so this cannot loop: after the third the issue is `ai-stuck`.
#
# It never checks out or runs a pull request's code. It reads the API as data, on the default branch's copy of this
# file, so a pull request cannot change what this job does. Runs from a bot that GitHub holds for approval
# (`action_required`) are approved ONLY when a program has read the PR's file list and found nothing but what the build lane writes
# (autonomy/pr-recovery.mjs::approvalVerdict: leaf browser modules, their proving test, the agent's state file, one script line, numeric
# perf ceilings, and the layout lane's appended CSS blocks). Any other file keeps the run held for a person, because a PR's own workflows run
# with the repo's secrets. `WF_AUTO_APPROVE=0` (repository variable) turns the approving off.
#
# Layout-lane pull requests (only appended, validated CSS in wf-agent-fixes.css) are also carried to the end here, because the agent's own PRs
# cannot start `pull_request_target` workflows (GITHUB_TOKEN events), so auto-merge.yml never runs for them: the head is rebuilt as a real merge
# of the default branch (two such PRs append at the same place, so one conflicts as soon as the other merges), the agent's bookkeeping file is
# left out (autonomy/.* is a sensitive path, so it alone asked for a person), and the PR is merged once the required checks passed on that exact
# commit. `WF_AUTO_LANE=0` (repository variable) turns the rebuilding and merging off.
# =============================================================================

on:
  workflow_run:
    workflows: ["WealthFlow CI (free)", "Consensus review board (Phase 3)"]
    types: [completed]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only say what would be done'
        required: false
        default: 'false'

permissions:
  contents: write        # delete the closed agent branch
  pull-requests: write   # close the agent's red PR
  issues: write          # explain on the issue why it came back
  actions: write         # re-run failed jobs once; start the fix agent again
  checks: read

concurrency:
  group: wf-pr-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Look at every open agent pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WF_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RECOVERY_DRY_RUN: ${{ inputs.dry_run }}
          WF_AUTO_APPROVE: ${{ vars.WF_AUTO_APPROVE || '1' }}
          WF_AUTO_LANE: ${{ vars.WF_AUTO_LANE || '1' }}
        run: node autonomy/pr-recovery.mjs
