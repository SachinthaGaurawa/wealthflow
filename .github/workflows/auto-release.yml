name: Auto Release (WealthFlow)

# =============================================================================
# Cuts a REAL release with no human required:
#   • bumps all 7 version locations via release.cjs (version law enforced)
#   • writes the changelog + version.json notes
#   • commits & pushes  ->  Vercel auto-deploys  ->  the in-app update system
#     announces the new version to users
# Firestore is OPTIONAL: brain-driven when FIREBASE_SERVICE_ACCOUNT is set,
# a simple "new commits since the last release tag" heuristic otherwise.
# Manual dispatch = one-click "Release now" (with optional explicit version).
#
# NOT CONFIGURED vs. FAILED — the distinction this file used to erase:
#   "the secret is absent" is a CONFIGURATION state and shows up as a SKIPPED
#   step, which is honest and visible. "the brain ran and could not do its job"
#   is a FAILURE and now turns the run RED. The old file collapsed both into a
#   green tick via `continue-on-error` plus `exit 0` plus `|| echo`, and the
#   result was a release chain that reported success for months without the
#   brain ever executing. Nothing in this file may swallow an error again.
#   `2>/dev/null` survives in exactly two places, both of which use the exit
#   code as an ANSWER rather than as an error: `git describe` ("is there a tag
#   at all?") and `git rev-parse --verify` ("does this tag exist?").
#
# NOTE ON `secrets` IN CONDITIONS (this is why the old file was invalid):
#   GitHub does NOT expose the `secrets` context to any `if:` — not a job's and
#   not a step's. Only `env`, `github`, `inputs`, `job`, `matrix`, `needs`,
#   `runner`, `steps`, `strategy` and `vars` are available there.
#   The legal pattern (used below) is to hoist the *presence* of the secret into
#   a job-level `env` value (job `env` DOES allow `secrets`) and then gate steps
#   on `env.HAS_FIREBASE`. If that gate were ever removed, the run is still
#   correct — but by failing loudly rather than by re-checking and skipping:
#   release-brain.js exits 1 when it has no credentials.
# =============================================================================

on:
  schedule:
    - cron: '0 */6 * * *'        # every 6h — release as soon as something REAL is waiting
  push:
    branches: [main]             # and right after a merge, so a fix does not wait for the clock
    paths-ignore:
      - 'CHANGELOG.md'
      - 'version.json'
      - 'merchants.json'
      - 'autonomy/state/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version X.Y.Z (blank = auto-bump)'
        required: false
        type: string
      bump:
        description: 'Bump kind when no explicit version'
        type: choice
        options: [patch, minor, major]
        default: patch
      urgent:
        description: 'Security release (forces the update for all users)'
        type: boolean
        default: false
      note:
        description: "What's-new text (optional)"
        required: false
        type: string

permissions:
  contents: write
  issues: write                  # a blocked or unconfirmed release files an issue instead of staying silent

# Shared with every workflow that pushes to the default branch, so two bots can
# never push at the same moment and lose a race.
concurrency:
  group: wealthflow-main-push
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40          # install + full suite (~3 min) + release + up to 12 min waiting for the deploy; a hung npm still cannot burn GitHub's 6h default
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0         # full history + tags (the "due" check needs them)
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Configure git
        run: |
          git config user.name  'WealthFlow Release Bot'
          git config user.email 'bot@wealthflow.local'

      # This job had NO install step at all. Every consumer of firebase-admin
      # below did its own `npm i firebase-admin@12 --no-save >/dev/null 2>&1`,
      # which floated the version, hid its own failure, and was repeated three
      # times. firebase-admin is a declared dependency, so one lockfile-backed
      # `npm ci` replaces all three and makes the tree reproducible.
      # NOT `npm ci || npm install`: a broken toolchain must never be able to
      # read as a completed release.
      - name: Install dependencies
        run: npm ci

      # NOT optional, NOT continue-on-error, and nothing here can swallow a
      # failure. See the CLI block at the bottom of release-brain.js for why
      # this step reported success in ~3 seconds on every release while doing
      # literally nothing: the file is ESM whose only export is a Vercel
      # handler, so `node release-brain.js` defined a function and exited 0.
      #
      # This step's whole purpose is the `system/pendingRelease` write that
      # autonomy/proposal-intake.mjs reads. If the brain cannot make that
      # write, the release must go red — a silent brain is precisely how the
      # proposal pipeline stayed empty while three workflows showed green.
      - name: Arm the release brain
        if: env.HAS_FIREBASE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_BRAIN_ENABLED: '1'
        run: node release-brain.js

      - name: Decide if a release is due
        id: due
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "due=yes" >> "$GITHUB_OUTPUT"
            echo "manual dispatch -> releasing"
            exit 0
          fi

          DUE=no
          BRAIN_ARMED=no

          # 1) has the brain armed a release? NOTE: this is now advisory only.
          #    A brain-armed release with no code change is still a fake release,
          #    so the substantive gate below is the authority on whether to ship;
          #    the brain only influences urgency and the release notes.
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            # This read stays non-fatal ON PURPOSE — unlike the brain step, its
            # answer is advisory (see above: the substantive gate is the
            # authority on whether to ship), so a Firestore blip must not block
            # a legitimate release. But it no longer fails INVISIBLY: the error
            # is printed instead of being swallowed by `catch(e){exit(0)}`.
            set +e
            node -e "(async()=>{try{const a=require('firebase-admin');a.initializeApp({credential:a.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT))});const d=await a.firestore().collection('system').doc('pendingRelease').get();const x=d.exists?d.data():{};process.exit((x.shouldRelease&&!x.consumed)?7:0);}catch(e){console.error('::warning::advisory brain read failed (release decision is unaffected): '+(e&&e.message||e));process.exit(0);}})();"
            RC=$?
            set -e
            if [ "$RC" = "7" ]; then
              BRAIN_ARMED=yes
              echo "brain: a release is armed (advisory — still subject to the substantive gate)"
            fi
          fi

          # 2) otherwise: has anything REAL changed since the last release tag?
          #
          #    THIS IS THE FIX FOR THE #1 REPORTED BUG. The old check was
          #    "are there any commits since the last tag?" — and because
          #    merchant-sync.yml pushes a chore(merchants) commit EVERY HOUR the
          #    answer was always yes. So this workflow cut v7.69.10 → .11 → .12
          #    with no functional change at all, the app told the user an update
          #    was available, they installed a byte-identical app, and correctly
          #    concluded the update system was lying.
          #
          #    autonomy/substantive.cjs answers the right question instead: does
          #    the diff contain a change that is neither a data/meta file nor a
          #    pure version-string rewrite? Verified against the real
          #    v7.69.11..v7.69.12 range, it reports NOT substantive.
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "${LAST:-}" ]; then
            # BOOTSTRAP. With no release tag, "commits since the last release" can never
            # be computed, so a scheduled release could NEVER fire (the tag is only made
            # by this workflow -> deadlock). Tag the CURRENT version at HEAD: this code IS
            # the current release, so there is nothing to ship right now, but every future
            # commit is now measurable and tomorrow's run works.
            #
            # None of this is best-effort. A bootstrap that silently fails to
            # push leaves the repo with no reachable tag, so the NEXT run
            # bootstraps again and a scheduled release can never fire — a
            # permanent deadlock that reports itself as a clean no-op run.
            CUR=$(node -p "require('./version.json').latest") || {
              echo "::error::could not read version.json — cannot bootstrap the release tag."
              exit 1
            }
            if [ -z "${CUR:-}" ] || [ "$CUR" = "undefined" ]; then
              echo "::error::version.json has no \`latest\` — cannot bootstrap the release tag."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$CUR" >/dev/null 2>&1; then
              echo "tag v$CUR exists but is not reachable from HEAD — leaving it alone"
            else
              git tag "v$CUR"
              git push origin "v$CUR"
            fi
            echo "bootstrapped tag v$CUR (no release tag was reachable) — nothing to release this run"
          else
            # `|| echo 0` used to turn a git failure into "no new commits",
            # which reads as "nothing to release" and skips the run silently.
            N=$(git rev-list "${LAST}..HEAD" --count) || {
              echo "::error::git rev-list ${LAST}..HEAD failed. Refusing to guess how many commits exist."
              exit 1
            }
            if [ "${N:-0}" -eq 0 ]; then
              echo "no new commits since $LAST"
              if [ "$BRAIN_ARMED" = "yes" ]; then
                echo "  (the brain armed a release, but there is literally nothing to ship —"
                echo "   arming a release does not make one exist.)"
              fi
            else
              echo "$N new commit(s) since $LAST — checking whether any of it is REAL…"
              set +e
              node autonomy/substantive.cjs "$LAST" HEAD
              RC=$?
              set -e
              if [ "$RC" = "0" ]; then
                DUE=yes
                echo "→ substantive change confirmed; a release is genuinely due."
              elif [ "$RC" = "3" ]; then
                echo "→ NOT substantive. Refusing to cut a fake release."
                echo "  (merchant data and version-string churn do not change the app."
                echo "   Shipping here is exactly the bug users reported.)"
                if [ "$BRAIN_ARMED" = "yes" ]; then
                  echo "  The brain had armed a release; the gate overrides it, because a"
                  echo "  release with no functional change is fake no matter who asked for it."
                fi
              else
                # The gate itself failed. Do NOT guess — a broken gate must never
                # silently fall back to "release anyway", which is how the fake
                # releases happened in the first place.
                echo "::error::substantive-change gate failed to run (exit $RC). Refusing to release blind."
                exit 1
              fi
            fi
          fi

          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "release due: $DUE"

          # Make the decision visible in the run summary — no more silent no-ops.
          {
            echo "### Release decision: $DUE"
            echo ""
            if [ "$DUE" = "yes" ]; then
              echo "A substantive change was found since \`${LAST:-<no tag>}\`, so a real release is being cut."
            else
              echo "Nothing substantive changed since \`${LAST:-<no tag>}\`. **No version bump.**"
              echo ""
              echo "This is the fake-release gate doing its job: the version number now only"
              echo "moves when the app actually changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── THE GATES THAT REPLACE THE HUMAN TAP ───────────────────────────────
      # For weeks release.cjs waited for `approval.approved=true`, a tap nobody
      # was there to give, and exited 2 — which this workflow reported as a green
      # "not a failure". 86 real commits sat un-announced behind a green tick.
      # The owner's rule is "no human intervention", so approval is now EARNED by
      # evidence gathered here, on the exact commit being released:
      #   1. a substantive change exists since the last tag (the step above)
      #   2. the full test suite passes on THIS commit (every trigger, manual too)
      #   3. production answers its health check right now
      # Fail any one and nothing is released AND the reason is filed as an issue.
      - name: Gates (tests on this commit + production health)
        id: gates
        if: steps.due.outputs.due == 'yes'
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://www.wealthflow.lk/api/health' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          WHY=""
          # Every trigger runs the suite, a manual "Release now" included: the
          # Release step passes --auto-approve, which is only honest if the tests
          # really passed on this exact commit (Codex review on #493).
          npm test > gate-tests.log 2>&1
          if [ $? -ne 0 ]; then WHY="the test suite is RED on $(git rev-parse --short HEAD): $(grep -E 'FAIL|failed' gate-tests.log | head -3 | tr '\n' ' ')"; fi
          OKH=no
          for i in 1 2 3; do
            CODE=$(curl -sL --max-redirs 5 -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL")
            if [ "$CODE" = "200" ]; then OKH=yes; break; fi
            sleep 10
          done
          if [ "$OKH" != "yes" ] && [ -z "$WHY" ]; then WHY="production health check failed 3 times ($HEALTH_URL answered $CODE)"; fi
          if [ -n "$WHY" ]; then
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::warning::release blocked: $WHY"
            { echo "### Release BLOCKED by a gate"; echo ""; echo "$WHY"; } >> "$GITHUB_STEP_SUMMARY"
            # Own label, NOT `pipeline-health`: pipeline-liveness closes whichever open issue carries
            # that one as soon as ITS checks pass, and those checks do not test HEALTH_URL or this
            # gate, so a still-blocked release could be closed under us (Codex review on #493).
            # `ai-stuck` also keeps the fix agent away: a red gate is not something a model edits.
            for L in release-blocked ai-stuck; do
              gh label list --limit 300 --json name --jq '.[].name' | grep -qx "$L" || gh label create "$L" --color B60205 --description "Release gate / needs a person"
            done
            if [ -z "$(gh issue list --label release-blocked --state open --search 'Release blocked' --json number --jq '.[0].number')" ]; then
              gh issue create --label release-blocked --label ai-stuck --title "Release blocked: real changes are waiting but a gate is red" \
                --body "$(printf 'A substantive change is waiting to be released, but a safety gate failed:\n\n> %s\n\nNothing was released. The release retries every 6 hours and after each merge, and closes this issue once it ships.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$WHY")"
            fi
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            echo "tested=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "gates passed: tests green on $(git rev-parse --short HEAD), production healthy"
          fi

      - name: Release
        id: release
        if: steps.due.outputs.due == 'yes' && steps.gates.outputs.ok == 'yes'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_BUMP: ${{ inputs.bump }}
          IN_URGENT: ${{ inputs.urgent }}
          IN_NOTE: ${{ inputs.note }}
          TESTED: ${{ steps.gates.outputs.tested }}
        run: |
          # firebase-admin comes from the `npm ci` above — no ad-hoc install,
          # no floating version, nothing to fail quietly here.

          # Build an argv ARRAY — never `eval` a command string. A release note
          # containing quotes, backticks or $(...) is then passed through verbatim
          # and can never be word-split, mangled, or executed.
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "${IN_VERSION:-}" ]; then
              ARGS+=(--version "$IN_VERSION")
            else
              ARGS+=("--${IN_BUMP:-patch}")
            fi
          else
            ARGS+=(--from-brain)      # degrades to a patch bump with no Firestore
          fi
          ARGS+=(--push --auto-approve)   # the Gates step above has just earned this
          if [ "${IN_URGENT:-}" = "true" ]; then ARGS+=(--urgent); fi
          if [ -n "${IN_NOTE:-}" ]; then ARGS+=(--note "$IN_NOTE"); fi

          # Get ahead of any other bot push before release.cjs commits. If this
          # fails the tree may be left mid-rebase, and running release.cjs on
          # top of that is strictly worse than stopping here.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"

          # The approval was earned for the commit the suite ran on. If main moved while we
          # worked, releasing the NEW head would ship code no gate has seen (Codex review on
          # #493). Stand down instead; whatever moved main starts its own run, and the 6-hourly
          # schedule is the backstop. This is a deliberate no-op, not a failure.
          if [ -n "${TESTED:-}" ] && [ "$(git rev-parse HEAD)" != "$TESTED" ]; then
            echo "moved=yes" >> "$GITHUB_OUTPUT"
            echo "::warning::main moved from ${TESTED:0:8} to $(git rev-parse --short HEAD) after the tests ran — not releasing code the gates have not seen. The next run tests the new head."
            { echo "### Release deferred"; echo ""; echo "Main moved after the gates ran (\`${TESTED:0:8}\` -> \`$(git rev-parse --short HEAD)\`). The next run tests the new head."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf 'running: node release.cjs'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          # release.cjs's own documented contract (see its header comment):
          # 0 ok, 2 nothing-to-do (skipped), 1 hard error. This step used to
          # run it as the last command of the block, so bash's default
          # (GitHub Actions runs `run:` under `set -e`) propagated ANY
          # non-zero exit as a step failure — including the fully
          # intentional exit 2 a proposal awaiting human approval via
          # /api/approve-release returns every single day until someone
          # approves it. A daily cron workflow going red for a state that
          # is not an error trains everyone watching it to ignore "Auto
          # Release failed" notifications, which defeats the point of
          # having them for the runs that are genuinely broken.
          set +e
          node release.cjs "${ARGS[@]}"
          RC=$?
          set -e
          if [ "$RC" = "2" ]; then
            # Exit 2 used to be reported as a green "not a failure". Combined with a human
            # tap nobody gave, that hid a stalled release chain for weeks. The gates have
            # already approved this release, so a decline now means something is wrong:
            # say so, and let the "Confirm" step below turn the run red.
            echo "declined=yes" >> "$GITHUB_OUTPUT"
            echo "::warning::release.cjs declined to ship although the gates approved it — see the [release] line above."
            {
              echo "### Release DECLINED (needs a look)"
              echo ""
              echo "\`release.cjs\` exited 2 after the gates had passed. Real changes are still un-released. See the log above for the exact reason."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RC" != "0" ]; then
            echo "::error::release.cjs failed (exit $RC) — see log above."
            exit "$RC"
          fi

      - name: Tag the release
        if: steps.due.outputs.due == 'yes' && steps.gates.outputs.ok == 'yes' && steps.release.outputs.declined != 'yes' && steps.release.outputs.moved != 'yes'
        run: |
          # The tag is not decoration: `git describe` above measures "what has
          # changed since the last release" from it. A tag that is skipped or
          # fails to push means the next run measures from an OLDER tag and can
          # cut a second release for work that already shipped. Failing after a
          # successful release is loud and easy to repair; a missing tag is
          # silent and corrupts every later decision.
          V=$(node -p "require('./version.json').latest") || {
            echo "::error::release.cjs ran but version.json is unreadable — the release is UNTAGGED."
            exit 1
          }
          if [ -z "${V:-}" ] || [ "$V" = "undefined" ]; then
            echo "::error::version.json has no \`latest\` after the release — the release is UNTAGGED."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null 2>&1; then
            echo "tag v$V already exists — nothing to do"
            exit 0
          fi
          git tag "v$V"
          git push origin "v$V"
          echo "tagged v$V"

      # ── A RELEASE IS NOT DONE WHEN IT IS PUSHED. IT IS DONE WHEN IT IS LIVE. ──
      # Poll the real production endpoints until they serve the new version in all
      # three places a device reads it: /api/version, /version.json and the app shell
      # itself (/app carries WF_APP_VERSION). Anything else files an issue and fails
      # the run, so "version bumped but nothing shipped" can never read as green again.
      - name: Confirm the new version is LIVE in production
        if: steps.due.outputs.due == 'yes' && steps.gates.outputs.ok == 'yes' && steps.release.outputs.declined != 'yes' && steps.release.outputs.moved != 'yes'
        env:
          BASE: ${{ vars.PUBLIC_BASE_URL || 'https://www.wealthflow.lk' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          V=$(node -p "require('./version.json').latest")
          echo "waiting for v$V to be served by $BASE"
          LIVE=no
          # Bounded by the CLOCK, not by a count: a count times a slow network can exceed the job
          # timeout, and a job killed by the timeout never reaches the issue-filing branch below.
          DEADLINE=$((SECONDS + 720))
          i=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            i=$((i+1))
            A=$(curl -sL --max-time 15 "$BASE/api/version?_=$i" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch(e){''}")
            B=$(curl -sL --max-time 15 "$BASE/version.json?_=$i" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).latest}catch(e){''}")
            C=$(curl -sL --max-time 20 "$BASE/app?_=$i" | grep -o "WF_APP_VERSION = '[0-9.]*'" | head -1 | grep -o "[0-9][0-9.]*")
            echo "try $i: api=$A version.json=$B app=$C"
            if [ "$A" = "$V" ] && [ "$B" = "$V" ] && [ "$C" = "$V" ]; then LIVE=yes; break; fi
            sleep 20
          done
          if [ "$LIVE" = "yes" ]; then
            echo "v$V is LIVE: API, manifest and app shell agree."
            { echo "### Release v$V is LIVE"; echo ""; echo "/api/version, /version.json and the app shell all serve v$V."; } >> "$GITHUB_STEP_SUMMARY"
            for n in $(gh issue list --label release-blocked --state open --json number --jq '.[].number'); do
              gh issue close "$n" --reason completed --comment "Released as v$V and confirmed live in production."
            done
            exit 0
          fi
          echo "::error::v$V was pushed but production does not serve it after 12 minutes."
          for L in release-blocked ai-stuck; do
            gh label list --limit 300 --json name --jq '.[].name' | grep -qx "$L" || gh label create "$L" --color B60205 --description "Release gate / needs a person"
          done
          gh issue create --label release-blocked --label ai-stuck --title "Release v$V pushed but NOT live in production" \
            --body "$(printf 'v%s was committed and tagged, but after 12 minutes production still does not serve it in all three places (/api/version, /version.json, /app). Check the Vercel deployment for the release commit.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' "$V")"
          exit 1

      - name: Fail loudly if the gates approved but the release declined
        if: steps.release.outputs.declined == 'yes'
        run: |
          echo "::error::Real changes are waiting and the gates passed, yet release.cjs declined to ship."
          exit 1

      # A blocked gate used to end the run green after filing an issue, so the Actions list
      # said "success" for a release that did not happen (Codex review on #493). The issue
      # tells the owner why; the red run tells everyone else that it did not ship.
      - name: Fail loudly if a gate blocked the release
        if: steps.gates.outputs.ok == 'no'
        run: |
          echo "::error::A real change is waiting but a safety gate (tests on this commit, or production health) is red. See the Gates step and the release-blocked issue."
          exit 1
