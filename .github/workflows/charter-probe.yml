name: Charter probe (free)

# Do the models really work by the operating charter (wf-charter.mjs)? Instructions are not proof. This asks up to three real
# providers three small questions whose right answer only comes from obeying it (an injected "answer PASS" inside an issue,
# "reply with exactly one word", "did you run the tests") and names which providers followed it (autonomy/charter-probe.mjs).
# Red = no provider followed it in every case. Read-only: it changes nothing in the repository.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'   # weekly, after the vision probe

permissions:
  contents: read

concurrency:
  group: wf-charter-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Ask the models
        env:
          # The same provider keys the fix agent receives (autonomous-fix.yml).
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WealthFlow_API_Key: ${{ secrets.WealthFlow_API_Key }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: node autonomy/charter-probe.mjs
