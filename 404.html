<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="color-scheme" content="dark light">
    <title>WealthFlow moved</title>
    <style>
        :root { --bg: #0a0d13; --card: #141a25; --line: #222b3b; --text: #eef1f7; --text-2: #aab3c5; --gold: #e4c26b; }
        @media (prefers-color-scheme: light) {
            :root { --bg: #f4f5f8; --card: #ffffff; --line: #e4e7ee; --text: #0f1420; --text-2: #4a5468; --gold: #8f6a1b; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; min-height: 100dvh; padding: 20px;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--text);
            font-family: Geist, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Sinhala", sans-serif;
        }
        .card {
            width: 100%; max-width: 420px; padding: 28px 24px; text-align: center;
            background: var(--card); border: 1px solid var(--line); border-radius: 18px;
        }
        .card img { display: block; height: 34px; width: auto; margin: 0 auto 18px; }
        .card p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--text-2); }
        .card a { color: var(--gold); font-weight: 600; text-underline-offset: 3px; }
        .card a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
    </style>
</head>
<body>
    <main class="card">
        <img src="https://www.wealthflow.lk/assets/wf-mark.svg" alt="WealthFlow">
        <p>WealthFlow is now available at <a href="https://www.wealthflow.lk">www.wealthflow.lk</a>.</p>
    </main>
    <script>
        (function () {
            var location = window.location;
            var path = location.pathname || '/';
            var prefix = '/wealthflow';
            if (location.hostname !== 'sachinthagaurawa.github.io'
                || (path !== prefix && path.indexOf(prefix + '/') !== 0)) return;
            path = path.slice(prefix.length) || '/';
            window.location.replace('https://www.wealthflow.lk' + path
                + (location.search || '') + (location.hash || ''));
        })();
    </script>
</body>
</html>
