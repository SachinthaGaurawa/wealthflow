<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark light">
<title>WealthFlow — Quick Capture</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/wf-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="wf-tokens.css">
<script>
  /* Follow the theme chosen in the app (same key the app reads) so this page never
     flashes dark on a light device; fall back to the device setting. */
  (function () {
    var t = '';
    try { t = (JSON.parse(localStorage.getItem('wf2_settings') || '{}') || {}).theme || ''; } catch (_) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="wealthflow-icons.js" defer></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: var(--wf-font);
    background: var(--wf-bg); color: var(--wf-text);
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .card {
    background: var(--wf-card);
    border: 1px solid var(--wf-line);
    border-radius: var(--wf-r-lg); padding: 24px;
    max-width: 480px; width: 100%;
    box-shadow: var(--wf-shadow-2);
  }
  .brand { display: block; height: 30px; width: auto; margin: 0 0 18px; }
  h1 { margin: 0 0 8px; font-size: var(--wf-fs-2xl); letter-spacing: -.01em; }
  .input {
    width: 100%; padding: 12px; border-radius: var(--wf-r-sm);
    background: var(--wf-field); border: 1px solid var(--wf-line-3);
    color: var(--wf-text); font-family: var(--wf-font-mono); font-size: 16px; line-height: 1.45;
    resize: vertical; min-height: 120px;
  }
  .input::placeholder { color: var(--wf-text-3); }
  .input:focus-visible, .btn:focus-visible { outline: none; box-shadow: var(--wf-focus); }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: var(--wf-r-sm);
    background: var(--wf-accent-fill); color: var(--wf-accent-ink);
    font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px;
    transition: background var(--wf-dur-2) var(--wf-ease), transform var(--wf-dur-1) var(--wf-ease);
  }
  .btn:hover { background: var(--wf-accent-fill-2); }
  .btn:active { transform: translateY(1px); }
  .btn-secondary {
    background: transparent; border: 1px solid var(--wf-line-3); color: var(--wf-text);
  }
  .btn-secondary:hover { background: var(--wf-hover); }
  .result {
    margin-top: 16px; padding: 14px; border-radius: var(--wf-r-sm);
    background: var(--wf-card-2); font-size: 13px; line-height: 1.6;
    display: none;
  }
  .result.ok { display: block; border-left: 3px solid var(--wf-pos); }
  .result.err { display: block; border-left: 3px solid var(--wf-neg); color: var(--wf-neg); }
  .hint { font-size: var(--wf-fs-sm); color: var(--wf-text-2); margin-top: 8px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<div class="card">
  <img class="brand" src="assets/wf-mark.svg" alt="WealthFlow">
  <h1>@devices@ Quick Capture</h1>
  <div class="hint" style="margin-bottom:14px;">
    Text shared from your SMS app or pasted below will be auto-classified by AutoPilot
    and routed to the right WealthFlow module.
  </div>
  <textarea id="txt" class="input" placeholder="SMS text appears here automatically when shared from iMessage / Messages app…"></textarea>
  <button class="btn" id="goBtn">@bot@ Classify &amp; Save</button>
  <button class="btn btn-secondary" id="openBtn">@info@ Open WealthFlow</button>
  <div class="result" id="result"></div>
</div>

<script>
  // Read URL params + share-target POST body
  (async function() {
    const params = new URLSearchParams(location.search);
    let initial = params.get('text') || params.get('sms') || params.get('message') || '';
    // iOS Shortcuts often pass via #
    if (!initial && location.hash) {
      const hashParams = new URLSearchParams(location.hash.slice(1));
      initial = hashParams.get('text') || hashParams.get('sms') || '';
    }
    // Web Share Target API delivers via FormData if registered as POST handler
    if (!initial && 'launchQueue' in window) {
      window.launchQueue.setConsumer(async (launchParams) => {
        if (!launchParams.files || !launchParams.files.length) return;
      });
    }
    if (initial) document.getElementById('txt').value = decodeURIComponent(initial);

    // Auto-classify on load if we received text
    if (initial && initial.trim().length > 10) {
      setTimeout(() => doClassify(), 300);
    }
  })();

  function getDeviceToken() {
    let tok = localStorage.getItem('wf_device_token');
    if (!tok) {
      // Generate one if missing (will sync with main app later via shared origin localStorage)
      const arr = new Uint8Array(24); crypto.getRandomValues(arr);
      tok = Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem('wf_device_token', tok);
    }
    return tok;
  }

  async function doClassify() {
    const txt = document.getElementById('txt').value.trim();
    const res = document.getElementById('result');
    if (!txt) {
      res.className = 'result err';
      res.textContent = 'Paste an SMS or share one from your Messages app first.';
      return;
    }
    res.className = 'result';
    res.textContent = '@bot@ Brain processing…';
    res.style.display = 'block';

    try {
      // Read card registry from localStorage so the brain can route correctly
      let cardRegistry = {};
      try {
        const settings = JSON.parse(localStorage.getItem('wf2_settings') || '{}');
        cardRegistry = settings.cardRegistry || {};
      } catch (_) {}

      const r = await fetch('/api/sms-ingest', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-wf-device-token': getDeviceToken()
        },
        body: JSON.stringify({
          sms: txt,
          sender: 'share-target',
          received_at_ms: Date.now(),
          device_id: 'ios-share',
          card_registry: cardRegistry
        })
      });
      const data = await r.json();

      if (data.ok && data.classified) {
        const m = data.routed && data.routed.module;
        const f = data.routed && data.routed.suggested_fields || {};
        const labels = {
          income: '@wallet@ Income',
          expenses: '@coins@ Expense',
          subscriptions: '@refresh@ Subscription',
          cconetime: '@card@ CC One-Time',
          cc_payment: '@checkCircle@ CC Payment (FIFO)'
        };
        res.className = 'result ok';
        res.innerHTML = `
          <div style="font-weight:700;color:var(--wf-pos);margin-bottom:6px;">@checkCircle@ Logged as ${labels[m] || m}</div>
          <div style="font-family:var(--wf-font-mono);">
            ${f.desc || f.source || f.name || ''}<br>
            <b>${(data.parsed && data.parsed.currency) || 'LKR'} ${(f.amount || 0).toLocaleString()}</b>
          </div>
          <div style="margin-top:8px;font-size:11px;opacity:.7;">Auto-saved to WealthFlow. Open the app to view.</div>`;
        // Queue the result for the main app to pick up via localStorage
        try {
          const inbox = JSON.parse(localStorage.getItem('wf_share_inbox') || '[]');
          inbox.push({ brain: data, captured_at: Date.now(), source: 'ios-share' });
          localStorage.setItem('wf_share_inbox', JSON.stringify(inbox.slice(-50)));
        } catch (_) {}
      } else if (data.ok && data.classified === false) {
        res.className = 'result err';
        res.textContent = '@alert@ ' + (data.reason || "Doesn't look like a bank SMS. Try again with a bank/credit-card message.");
      } else {
        res.className = 'result err';
        res.textContent = '@alert@ ' + (data.error || data.reason || 'Could not classify.');
      }
    } catch (e) {
      res.className = 'result err';
      res.textContent = '@alert@ Network error: ' + e.message;
    }
  }

  document.getElementById('goBtn').addEventListener('click', doClassify);
  document.getElementById('openBtn').addEventListener('click', () => location.href = '/');
</script>
</body>
</html>
