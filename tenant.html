<title>Your WealthFlow statement</title>
<!-- Served at /t/<token> by vercel.json. Everything it loads is this site's own file: the page is under a policy that refuses anything else. -->
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=7.69.34">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=7.69.34">

<body>
<main id="tp-root" class="tp-page" aria-live="polite">
    <!-- What a person sees while the page's script is still on its way: WealthFlow's loading look on white. tenant-page.js adopts this same element as its loading screen (see splashEl there), so the two must stay alike. It is hidden for the first 0.3 s by the stylesheet: a quick load never shows it. -->
    <div class="tp-splash" id="tp-splash" role="status">
        <div class="tp-splash-mark" aria-hidden="true"><img class="tp-splash-logo" src="/assets/wf-mark.svg" alt="" width="112" height="112"></div>
        <h1 class="tp-splash-name">WealthFlow</h1>
        <p class="tp-splash-sub" aria-hidden="true">Infinity Engine</p>
        <div class="tp-splash-bar" aria-hidden="true"><span></span></div>
        <p class="tp-splash-status"></p>
        <p class="tp-splash-stuck">Still loading? Please reload this page.<br><span lang="si">තවමත් පූරණය වෙමින් පවතීද? කරුණාකර මෙම පිටුව නැවත පූරණය කරන්න.</span></p>
    </div>
    <noscript>
        <div class="tp-wrap">
            <h1 class="tp-brand"><span>WealthFlow</span></h1>
            <p class="tp-note">This page needs JavaScript to keep your statement private. Please turn it on and reload.</p>
        </div>
    </noscript>
</main>
<script type="module" src="/tenant-page.js"></script>
</body>
</html>
